[project]
name = "isotherm-bet-analysis"
version = "0.1.0"
description = "Reproducible BET analysis of adsorption isotherms"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4,<3",
    "scipy>=1.17,<2",
    "xlsxwriter>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.13,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
